<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Application DevOps</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; } 
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; max-width: 500px; } 
        h1 { color: #764ba2; margin-bottom: 10px; } 
        p { color: #666; font-size: 1.1em; line-height: 1.6; } 
        .badge { background-color: #2ecc71; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Application d’Adja 🎉</h1>
        <p>Mon premier pipeline Jenkins + Docker fonctionne parfaitement.</p>
        <div class="badge">Pipeline Connecté & Vert</div>
    </div>
</body>
</html>
